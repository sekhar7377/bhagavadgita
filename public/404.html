<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cfcdc7" />
    <meta name="robots" content="noindex" />
    <title>Lost on the wall — Mahābhārata</title>
    <link rel="icon" href="/bhagavadgita/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #d4d1ca url("/bhagavadgita/relief/plaster.webp") center / 640px;
        color: #030303;
        font-family: "Times New Roman", Tinos, serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      p.eyebrow {
        font-family: Arial, Arimo, sans-serif;
        font-size: 11px;
        letter-spacing: 0.18em;
        opacity: 0.6;
        margin: 0 0 24px;
      }
      h1 {
        font-weight: 400;
        font-size: clamp(30px, 4vw, 54px);
        line-height: 1.12;
        margin: 0 0 32px;
      }
      a {
        color: inherit;
        font-family: Arial, Arimo, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MAHĀBHĀRATA · THE EIGHTEEN ECLIPSES</p>
      <h1>This part of the wall<br /><em>was never carved.</em></h1>
      <a href="/bhagavadgita/">Return to the beginning</a>
    </main>
  </body>
</html>
