<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cfcdc7" />
    <meta name="robots" content="noindex" />
    <title>Offline — Mahābhārata</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #d4d1ca url("relief/plaster.webp") center / 640px;
        color: #030303;
        font-family: "Times New Roman", Tinos, serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      p.eyebrow {
        font-family: Arial, Arimo, sans-serif;
        font-size: 11px;
        letter-spacing: 0.18em;
        opacity: 0.6;
        margin: 0 0 24px;
      }
      h1 {
        font-weight: 400;
        font-size: clamp(30px, 4vw, 54px);
        line-height: 1.12;
        margin: 0 0 24px;
      }
      p {
        font-family: Arial, Arimo, sans-serif;
        font-size: 14px;
        max-width: 34em;
        margin: 0 auto 28px;
        line-height: 1.6;
      }
      button {
        font: inherit;
        font-family: Arial, Arimo, sans-serif;
        font-size: 14px;
        background: none;
        border: 1px solid currentColor;
        border-radius: 99px;
        padding: 10px 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MAHĀBHĀRATA · THE EIGHTEEN ECLIPSES</p>
      <h1>The wall is out of reach<br /><em>for a moment.</em></h1>
      <p>
        There is no connection, and this part of the epic has not been read on
        this device yet. Chapters you have already visited still open offline.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
